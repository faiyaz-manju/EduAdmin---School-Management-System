name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Set to false so if one Python version fails, the others still run
      fail-fast: false 
      max-parallel: 4
      matrix:
        # Python 3.7 is EOL. Using modern versions supported by Django 4.2 and 5.0+
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Caches dependencies to speed up future runs
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check for missing migrations
      run: |
        # Fails the build if you forgot to commit a migration file
        python manage.py makemigrations --check --dry-run
        
    - name: Run Tests
      run: |
        python manage.py test
